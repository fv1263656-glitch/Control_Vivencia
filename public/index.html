<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control de Vivencia - Consulta</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="header">
    <h1>Sistema de Control de Vivencia</h1>
    <img src="logo.png" alt="Pro-Vida Seguros" class="logo">
  </div>

  <div class="container">
    <h2>CONSULTA RENTISTAS CON CUENTA BANCARIA</h2>
    <p class="subtitulo">Ingrese únicamente el número de documento de identidad</p>

    <form id="formBusqueda">
      <div>
        <label for="ci">Documento de identidad con extencion</label>
        <input type="text" id="ci" name="ci" placeholder="Ej: 5544816-1A" autofocus autocomplete="off" inputmode="alfanumerico">
      </div>

      <div class="mensaje-error" id="mensajeError"></div>

      <button type="submit">Buscar</button>
    </form>

    <div class="acciones" style="margin-top:18px; font-size:0.85rem;">
      <a href="admin.html">Actualizar archivo de datos</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('formBusqueda');
    const inputCI = document.getElementById('ci');
    const mensajeError = document.getElementById('mensajeError');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const ci = inputCI.value.trim();
      mensajeError.style.display = 'none';

      if (!ci) {
        mensajeError.textContent = 'Por favor ingrese un documento de identidad.';
        mensajeError.style.display = 'block';
        return;
      }

      // Redirige a la página de resultados con el CI como parámetro
      window.location.href = 'resultado.html?ci=' + encodeURIComponent(ci);
    });
  </script>

</body>
</html>
